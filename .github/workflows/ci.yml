name: CI

on:
  push:
    branches: [dev, fix-dev]
    tags: ["v*"]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run tests
        run: make test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.sha }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          if [ "$GOARCH" = amd64 ]; then
            make build-linux
          else
            make build-linux-arm64
          fi
      - name: Install UPX
        run: sudo apt-get update && sudo apt-get install -y upx-ucl
      - name: Compress and verify build files
        env:
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -eu
          for file in "xboard-node-linux-$GOARCH" "xbctl-linux-$GOARCH"; do
            test -s "$file"
            upx "$file"
            upx -t "$file"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.goarch }}
          path: |
            xboard-node-linux-${{ matrix.goarch }}
            xbctl-linux-${{ matrix.goarch }}
          if-no-files-found: error

  docker-test:
    name: Test Docker build
    runs-on: ubuntu-latest
    needs: build
    outputs:
      publish: ${{ steps.metadata.outputs.publish }}
      latest: ${{ steps.metadata.outputs.latest }}
    permissions:
      contents: read
      packages: write
    concurrency:
      group: docker-publish-${{ github.event_name == 'push' && (github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v')) && 'release' || github.run_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          merge-multiple: true
          path: dist
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v'))
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare image metadata
        id: metadata
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          image=ghcr.io/coder6380/xboard-node
          tags="$image:ci"
          publish=false
          latest=false
          if [ "$EVENT_NAME" = push ] && [ "$REF" = refs/heads/dev ]; then
            current=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/dev" --jq .object.sha)
            if [ "$current" = "$SHA" ]; then
              publish=true
              tags="$image:dev"
            fi
          elif [ "$EVENT_NAME" = push ] && [[ "$REF" = refs/tags/v* ]]; then
            publish=true
            tags="$image:$REF_NAME"
            git fetch --force --tags
            highest=$(git tag -l 'v*' --sort=-version:refname | tr -d '\r' | { IFS= read -r line; printf '%s' "$line"; })
            if [ "$REF_NAME" = "$highest" ]; then
              tags="$tags,$image:latest"
              latest=true
            fi
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
      - name: Build and optionally push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.metadata.outputs.publish == 'true' }}
          tags: ${{ steps.metadata.outputs.tags }}

  publish:
    name: Publish
    if: needs.docker-test.outputs.publish == 'true'
    runs-on: ubuntu-latest
    needs: docker-test
    permissions:
      contents: write
    concurrency:
      group: publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          merge-multiple: true
          path: dist
      - name: Verify release files
        run: |
          for file in xboard-node-linux-amd64 xboard-node-linux-arm64 xbctl-linux-amd64 xbctl-linux-arm64; do
            test -s "dist/$file" || { echo "Missing or empty: $file" >&2; exit 1; }
          done
      - name: Move development tag to built commit
        if: github.ref == 'refs/heads/dev'
        env:
          SHA: ${{ github.sha }}
        run: |
          git tag -f dev "$SHA"
          git push origin refs/tags/dev --force
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref == 'refs/heads/dev' && 'dev' || github.ref_name }}
          prerelease: ${{ github.ref == 'refs/heads/dev' }}
          make_latest: ${{ needs.docker-test.outputs.latest }}
          fail_on_unmatched_files: true
          files: |
            dist/xboard-node-linux-amd64
            dist/xboard-node-linux-arm64
            dist/xbctl-linux-amd64
            dist/xbctl-linux-arm64
