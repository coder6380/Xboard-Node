name: CI

on:
  push:
    branches: [dev, fix-dev]
    tags: ["v*"]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run tests
        run: make test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.sha }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          if [ "$GOARCH" = amd64 ]; then
            make build-linux
          else
            make build-linux-arm64
          fi
      - name: Verify build files
        env:
          GOARCH: ${{ matrix.goarch }}
        run: |
          test -s "xboard-node-linux-$GOARCH"
          test -s "xbctl-linux-$GOARCH"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.goarch }}
          path: |
            xboard-node-linux-${{ matrix.goarch }}
            xbctl-linux-${{ matrix.goarch }}
          if-no-files-found: error

  docker-test:
    name: Test Docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Set build time
        id: time
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Build without publishing
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          platforms: linux/amd64
          build-args: |
            VERSION=${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.sha }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.time.outputs.value }}

  publish:
    name: Publish
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    needs: [build, docker-test]
    permissions:
      contents: write
      packages: write
    concurrency:
      group: publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check publication eligibility
        id: eligibility
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          if [ "$REF" = refs/heads/dev ]; then
            current=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/dev" --jq .object.sha)
            if [ "$current" != "$SHA" ]; then
              echo 'publish=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo 'latest=false' >> "$GITHUB_OUTPUT"
          else
            # 仅最高版本标签更新 latest，避免较旧版本的构建覆盖它。
            highest=$(git tag -l 'v*' --sort=-version:refname | tr -d '\r' | { IFS= read -r line; printf '%s' "$line"; })
            if [ "$REF_NAME" = "$highest" ]; then
              echo 'latest=true' >> "$GITHUB_OUTPUT"
            else
              echo 'latest=false' >> "$GITHUB_OUTPUT"
            fi
          fi
          echo 'publish=true' >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: steps.eligibility.outputs.publish == 'true'
        with:
          merge-multiple: true
          path: dist
      - name: Verify release files
        if: steps.eligibility.outputs.publish == 'true'
        run: |
          for file in xboard-node-linux-amd64 xboard-node-linux-arm64 xbctl-linux-amd64 xbctl-linux-arm64; do
            test -s "dist/$file" || { echo "Missing or empty: $file" >&2; exit 1; }
          done
      - uses: docker/login-action@v3
        if: steps.eligibility.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
        if: steps.eligibility.outputs.publish == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.eligibility.outputs.publish == 'true'
      - name: Prepare image metadata
        if: steps.eligibility.outputs.publish == 'true'
        id: metadata
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          LATEST: ${{ steps.eligibility.outputs.latest }}
        run: |
          image=ghcr.io/coder6380/xboard-node
          if [ "$REF" = refs/heads/dev ]; then
            version=$SHA
            tags="$image:dev"
          else
            version=$REF_NAME
            tags="$image:$REF_NAME"
            if [ "$LATEST" = true ]; then
              tags="$tags,$image:latest"
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Build and push image
        if: steps.eligibility.outputs.publish == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadata.outputs.tags }}
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.metadata.outputs.build_time }}
      - name: Move development tag to built commit
        if: steps.eligibility.outputs.publish == 'true' && github.ref == 'refs/heads/dev'
        env:
          SHA: ${{ github.sha }}
        run: |
          git tag -f dev "$SHA"
          git push origin refs/tags/dev --force
      - name: Publish release
        if: steps.eligibility.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref == 'refs/heads/dev' && 'dev' || github.ref_name }}
          prerelease: ${{ github.ref == 'refs/heads/dev' }}
          make_latest: ${{ steps.eligibility.outputs.latest }}
          fail_on_unmatched_files: true
          files: |
            dist/xboard-node-linux-amd64
            dist/xboard-node-linux-arm64
            dist/xbctl-linux-amd64
            dist/xbctl-linux-arm64
